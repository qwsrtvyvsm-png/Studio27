<body data-page="thanks">

    <div class="container">
      <p class="script">Thank You</p>
      <h1 class="display" id="ty-title">Request <em>received</em></h1>
      <div class="rule">&#10022;</div>
      <p id="ty-text">We&rsquo;ve received your booking request and will be in touch shortly to confirm.</p>

    if (new URLSearchParams(location.search).get('type') === 'application') {
      document.getElementById('ty-title').innerHTML = 'Application <em>received</em>';
      document.getElementById('ty-text').textContent = 'Thank you for applying. We’ll be in touch confidentially within [2 business days].';

  </script>
